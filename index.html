
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Browser</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;color:white;font-family:Arial,sans-serif;
 background:#080d20 url("https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?auto=format&fit=crop&w=2000&q=85") center/cover fixed;
 min-height:100vh
}
header{padding:20px 5%;background:#080d20cc;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:800;letter-spacing:5px}
.status{color:#8fffd2;font-size:12px}
main{max-width:1200px;margin:45px auto;padding:20px}
h1{text-align:center;font-size:48px;letter-spacing:8px;margin-bottom:5px}
.subtitle{text-align:center;color:#b9c9e8;letter-spacing:3px}
.browser{margin-top:35px;background:#101a32eF;border:1px solid #536b9b;border-radius:16px;padding:14px;box-shadow:0 15px 50px #0008}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:#263858;color:white;border:1px solid #50658b;border-radius:8px;padding:11px 14px;cursor:pointer}
button:hover{background:#42618d}
input{flex:1;min-width:160px;padding:13px;border-radius:8px;border:1px solid #647ba5;background:#091326;color:white;font-size:15px}
#view{width:100%;height:560px;margin-top:13px;background:white;border:0;border-radius:9px}
.note{color:#bac8df;font-size:12px;margin:10px 3px}
.shortcuts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:25px}
.shortcuts a{color:white;text-decoration:none;background:#172744dd;padding:14px 20px;border:1px solid #526a91;border-radius:10px}
.shortcuts a:hover{background:#344c75}
@media(max-width:600px){h1{font-size:32px}.toolbar button{padding:9px}#view{height:420px}}
</style>
</head>
<body>
<header>
 <div class="logo">NEXUS</div>
 <div class="status">● ONLINE</div>
</header>
<main>
 <h1>NEXUS BROWSER</h1>
 <p class="subtitle">YOUR SPACE. YOUR WEB.</p>

 <section class="browser">
  <div class="toolbar">
   <button onclick="back()">←</button>
   <button onclick="forward()">→</button>
   <button onclick="reload()">↻</button>
   <input id="address" placeholder="Enter a website or search..." onkeydown="if(event.key==='Enter')go()">
   <button onclick="go()">GO</button>
  </div>
  <iframe id="view" title="NEXUS browsing area"
   srcdoc="<body style='background:#101a32;color:white;font-family:Arial;text-align:center;padding:70px 15px'><h1>Welcome to NEXUS</h1><p>Enter a website above to begin.</p><p>Some websites do not allow embedded browsing.</p></body>"></iframe>
  <p class="note">Some websites block embedded browsing. If a site does not load, open it in a new tab.</p>
 </section>

 <div class="shortcuts">
  <a href="https://www.google.com" target="_blank">Google ↗</a>
  <a href="https://play.geforcenow.com" target="_blank">GeForce NOW ↗</a>
  <a href="https://www.crazygames.com" target="_blank">CrazyGames ↗</a>
  <a href="https://www.wikipedia.org" target="_blank">Wikipedia ↗</a>
 </div>
</main>

<script>
const frame = document.getElementById("view");
const address = document.getElementById("address");

async function go() {
  let value = address.value.trim();
  if (!value) return;

  let url = value.startsWith("https://")
    ? value
    : "https://" + value;

  frame.srcdoc = `
    <body style="background:#101a32;color:white;
    font-family:Arial;padding:30px">
    <h2>Connecting to NEXUS...</h2>
    <p>Loading approved public page.</p>
    </body>`;

  try {
    const response = await fetch(
      "/api/browse?url=" + encodeURIComponent(url)
    );

    const data = await response.json();

    if (!response.ok) throw new Error(data.error);

    frame.srcdoc = `
      <body style="background:#101a32;color:white;
      font-family:Arial;padding:30px;line-height:1.7">
      <h1>${escapeHTML(data.title)}</h1>
      <hr>
      <p style="white-space:normal">${escapeHTML(data.content)}</p>
      </body>`;
  } catch (error) {
    frame.srcdoc = `
      <body style="background:#101a32;color:white;
      font-family:Arial;padding:30px">
      <h2>Unable to load page</h2>
      <p>${escapeHTML(error.message)}</p>
      </body>`;
  }
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function back() {
  history.back();
}

function forward() {
  history.forward();
}

function reload() {
  go();
}
</script>
</body>
</html>
