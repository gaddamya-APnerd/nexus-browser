
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS | Space Browser</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;font-family:Arial,sans-serif;
 background:
 linear-gradient(90deg,rgba(4,8,22,.88),rgba(4,8,22,.35)),
 url("https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?auto=format&fit=crop&w=2200&q=90")
 center/cover fixed;
}
header{padding:25px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:bold;letter-spacing:7px}
.status{color:#b7c9ff;font-size:12px;letter-spacing:3px}
main{max-width:1000px;margin:10vh auto;padding:25px;text-align:center}
h1{font-size:clamp(45px,8vw,85px);letter-spacing:12px;margin:0;text-shadow:0 0 35px #8a9fff}
.subtitle{color:#c5cbe4;letter-spacing:5px;margin:15px 0 45px}
.search{display:flex;max-width:700px;margin:auto;gap:10px}
input,select,button{border:1px solid #7584ad;background:#111a30dd;color:white;padding:15px;border-radius:12px;font-size:15px}
input{flex:1;min-width:0}
button{cursor:pointer;background:#536cbb}
button:hover{background:#718ee8}
h2{font-size:14px;letter-spacing:5px;margin-top:55px;color:#c5d4ff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:22px}
.card{
 display:block;padding:25px 15px;border-radius:18px;
 background:#111a30a8;border:1px solid #7183ad66;
 backdrop-filter:blur(12px);text-decoration:none;color:white;
 transition:.25s
}
.card:hover{transform:translateY(-6px);background:#26385dcc;border-color:#a6b9ff}
.card strong{display:block;font-size:17px;margin-bottom:10px}
.card span{font-size:12px;color:#b7c6e9}
footer{padding:35px;text-align:center;color:#9caaca;font-size:11px;letter-spacing:3px}
@media(max-width:550px){header{padding:18px}main{margin:7vh auto}.search{flex-wrap:wrap}.search input{min-width:100%}}
</style>
</head>
<body>
<header>
 <div class="logo">NEXUS</div>
 <div class="status">● SYSTEM ONLINE</div>
</header>
<main>
 <h1>NEXUS</h1>
 <div class="subtitle">EXPLORE BEYOND LIMITS</div>

 <form class="search" id="searchForm">
  <select id="engine">
   <option value="https://www.google.com/search?q=">Google</option>
   <option value="https://www.bing.com/search?q=">Bing</option>
   <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
  </select>
  <input id="query" placeholder="Search the universe..." required>
  <button>SEARCH</button>
 </form>

 <h2>MISSION CONTROL</h2>
 <div class="grid">
  <a class="card" href="https://play.geforcenow.com/" target="_blank" rel="noopener"><strong>🎮 GEFORCE NOW</strong><span>Cloud gaming</span></a>
  <a class="card" href="https://www.crazygames.com/" target="_blank" rel="noopener"><strong>🕹️ ARCADE</strong><span>Browser games</span></a>
  <a class="card" href="https://www.youtube.com/" target="_blank" rel="noopener"><strong>▶ MEDIA</strong><span>Video streaming</span></a>
  <a class="card" href="https://www.wikipedia.org/" target="_blank" rel="noopener"><strong>🌌 EXPLORE</strong><span>Discover knowledge</span></a>
 </div>
</main>
<footer>NEXUS SPACE INTERFACE • SATURN EDITION</footer>
<script>
document.getElementById("searchForm").addEventListener("submit",e=>{
 e.preventDefault();
 const q=document.getElementById("query").value.trim();
 if(q)window.open(document.getElementById("engine").value+encodeURIComponent(q),"_blank","noopener");
});
</script>
</body>
</html>
